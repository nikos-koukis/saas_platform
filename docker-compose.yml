services:
  mongo:
    # Pinned to 7: mongo:8 fails to start on Linux kernels 6.19+ (SERVER-121912).
    image: mongo:7
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      target: runner
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/saas_platform
      JWT_SECRET: ${JWT_SECRET:?missing — run `cp .env.example .env`, then set a value at least 32 characters long}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # Must match the origin the browser loads the dashboard from.
      CORS_ORIGIN: http://localhost:${FRONTEND_PORT:-3000}
      NODE_ENV: production
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      target: runner
      args:
        # Baked into the client bundle, so it is the browser's view of the API.
        NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-4000}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

  # Runs to completion on every `up`, but --if-empty makes it a no-op once the
  # volume holds data, so restarts never discard what you created.
  seed:
    build:
      context: ./backend
      target: seeder
    environment:
      MONGODB_URI: mongodb://mongo:27017/saas_platform
      JWT_SECRET: ${JWT_SECRET:?missing — run `cp .env.example .env`}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-demo@saasdash.dev}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-demo12345}
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

volumes:
  mongo-data:
